name: Create Client CI

on:
  push:
    paths:
      - 'back-end/clients/create-client/**'
    branches:
      - Development

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/clients/create-client

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clients_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies (with dev)
        run: npm install --include=dev

      - name: 🧪 Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: admin
          DB_NAME: clients_db
        run: npx jest

