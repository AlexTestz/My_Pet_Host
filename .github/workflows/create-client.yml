name: Create Client CI

on:
  push:
    paths:
      - 'back-end/clients/create-client/**'
    branches:
      - Development

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/clients/create-client

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test
