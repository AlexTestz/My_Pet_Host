name: Create Client CI

on:
  push:
    paths:
      - 'back-end/clients/create-client/**'
    branches:
      - Development

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/clients/create-client

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: pet_care_clients_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies (with dev)
        run: npm install --include=dev

      - name: 🕓 Wait for PostgreSQL to be ready
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready!" && exit 0
            echo "Waiting for postgres... ($i)"
            sleep 2
          done
          echo "Postgres did not become ready in time!" && exit 1

      - name: 🧪 Run tests
        env:
          NODE_ENV: ci
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: admin
          PG_DATABASE: pet_care_clients_db
        run: npx jest --detectOpenHandles
